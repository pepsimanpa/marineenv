name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '5.0.408'
      - name: Restore Solution
        run: dotnet restore MarineEnvironment.sln
      - name: Build Solution
        run: dotnet build MarineEnvironment.sln --configuration Release --no-restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python wrapper
        run: python -m pip install -e ./python
      - name: Compile Python examples
        run: python -m compileall python/examples
      - name: Python wrapper smoke test
        run: python python/tests/smoke.py
      - name: KHOA seasonal mean smoke tests
        run: dotnet run --project tests/KhoaSeasonalSmoke/KhoaSeasonalSmoke.csproj --configuration Release --no-restore
      - name: Korea sediment mapping and shapefile integration tests
        run: dotnet run --project tests/KoreaSedimentSmoke/KoreaSedimentSmoke.csproj --configuration Release
