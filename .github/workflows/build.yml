name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/MarineEnvironment/MarineEnvironment.csproj
      - name: Build
        run: dotnet build src/MarineEnvironment/MarineEnvironment.csproj --configuration Release --no-restore
